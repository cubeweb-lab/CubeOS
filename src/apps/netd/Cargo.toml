[package]
name = "netd"
version = "0.1.0"
edition = "2021"

[dependencies]
cube_syscall = { path = "../../libs/cube_syscall" }
smoltcp = { version = "0.11", default-features = false, features = ["proto-ipv4", "socket-tcp", "socket-udp", "medium-ethernet", "dhcpv4"] }
log = "0.4"

[lib]
crate-type = ["staticlib"]
path = "src/main.rs"

[profile.release]
panic = "abort"
opt-level = "s"
lto = true

